name: Final dashboard repair
on:
  push:
    branches: [test-chatgpt-write]
jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[final-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-chatgpt-write
          fetch-depth: 0
      - name: Patch source files
        shell: python
        run: |
          from pathlib import Path
          import re
          # Dashboard: max/min narrative + Device terminology.
          p=Path('app/dashboard.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('d=alerts.groupby("Part",as_index=False)["Count"].sum().sort_values("Count",ascending=False).head(10);st.plotly_chart(horizontal_bar(d["Part"].astype(str).tolist(),d["Count"].tolist(),"⚡ Highest Alert / Part Frequency","#d3342f",360," alerts"),use_container_width=True,config={"displayModeBar":False})','d=alerts.groupby("Device",as_index=False)["Count"].sum().sort_values("Count",ascending=False).head(10);st.plotly_chart(horizontal_bar(d["Device"].astype(str).tolist(),d["Count"].tolist(),"⚡ Highest Alert / Device Frequency","#d3342f",360," alerts"),use_container_width=True,config={"displayModeBar":False})')
          anchor='for c,item in zip(st.columns(4),kpis[5:]):render_kpi(c,item)\n\nif view=="Day":'
          insert='for c,item in zip(st.columns(4),kpis[5:]):render_kpi(c,item)\n\nif stats and stats.get("max_date") is not None and stats.get("min_date") is not None:\n    max_date=pd.to_datetime(stats["max_date"]).strftime("%d %b %Y")\n    min_date=pd.to_datetime(stats["min_date"]).strftime("%d %b %Y")\n    st.markdown(f\'<div class="qbr-volume-note">📌 Maximum ticket volume: <b>{_safe_int(stats.get("max_count")):,}</b> tickets on <b>{max_date}</b> &nbsp; • &nbsp; Minimum ticket volume: <b>{_safe_int(stats.get("min_count")):,}</b> tickets on <b>{min_date}</b>.</div>\',unsafe_allow_html=True)\n\nif view=="Day":'
          if anchor not in s: raise SystemExit('dashboard anchor missing')
          s=s.replace(anchor,insert)
          p.write_text(s,encoding='utf-8')

          # Analytics: replace hierarchy context functions with FK + assignment fallback.
          p=Path('app/dashboard_data.py'); s=p.read_text(encoding='utf-8')
          new_ticket=r'''def _ticket_context(db, alias: str = "tk"):
              cols=_columns(db,"Ticket"); joins=""
              has_tower="TowerID" in cols and _table_exists(db,"Tower"); has_track="TrackID" in cols and _table_exists(db,"Track"); has_tt="TowerTrackID" in cols and _table_exists(db,"TowerTrack")
              if has_tower: joins+=f" LEFT JOIN qbr.Tower t ON t.TowerID={alias}.TowerID"
              if has_track: joins+=f" LEFT JOIN qbr.Track tr ON tr.TrackID={alias}.TrackID"
              if has_tt: joins+=f" LEFT JOIN qbr.TowerTrack tt ON tt.TowerTrackID={alias}.TowerTrackID"
              ag=f"NULLIF(LTRIM(RTRIM({alias}.AssignmentGroup)),'')" if "AssignmentGroup" in cols else "NULL"
              tf=f"CASE WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-SFNOC%' OR UPPER(COALESCE({ag},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({ag},'')) LIKE '%HSBC-DATA%' THEN 'Foundation' ELSE NULL END"
              trf=f"CASE WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-SFNOC%' THEN 'SFNOC' WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({ag},'')) LIKE '%JLK%' THEN 'THD Data' WHEN UPPER(COALESCE({ag},'')) LIKE '%HSBC-DATA%' THEN 'HSBC Data' ELSE NULL END"
              tp=[]; rp=[]
              if "ProjectName" in cols: tp.append(f"NULLIF(LTRIM(RTRIM({alias}.ProjectName)),'')")
              if has_tower: tp.append("t.TowerName")
              if has_tt: tp.append("tt.TowerName")
              tp.append(tf)
              if "TrackName" in cols: rp.append(f"NULLIF(LTRIM(RTRIM({alias}.TrackName)),'')")
              if has_track: rp.append("tr.TrackName")
              if has_tt: rp.append("tt.TrackName")
              rp.append(trf)
              tower_expr="COALESCE("+",".join(tp)+",'Unknown')"; track_expr="COALESCE("+",".join(rp)+",'Unknown')"
              scope=f"(:tower IS NULL OR {tower_expr}=:tower) AND (:track IS NULL OR {track_expr}=:track)"
              return cols,joins,tower_expr,track_expr,scope


          def _alert_context'''
          s=re.sub(r'def _ticket_context\(db, alias: str = "tk"\):.*?\n\ndef _alert_context',new_ticket,s,count=1,flags=re.S)
          new_alert=r'''def _alert_context(db, alias: str = "a"):
              cols=_columns(db,"Alert"); joins=""
              has_tower="TowerID" in cols and _table_exists(db,"Tower"); has_track="TrackID" in cols and _table_exists(db,"Track"); has_tt="TowerTrackID" in cols and _table_exists(db,"TowerTrack")
              if has_tower: joins+=f" LEFT JOIN qbr.Tower t ON t.TowerID={alias}.TowerID"
              if has_track: joins+=f" LEFT JOIN qbr.Track tr ON tr.TrackID={alias}.TrackID"
              if has_tt: joins+=f" LEFT JOIN qbr.TowerTrack tt ON tt.TowerTrackID={alias}.TowerTrackID"
              ag=f"NULLIF(LTRIM(RTRIM({alias}.AssignmentGroup)),'')" if "AssignmentGroup" in cols else "NULL"
              tf=f"CASE WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-SFNOC%' OR UPPER(COALESCE({ag},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({ag},'')) LIKE '%HSBC-DATA%' THEN 'Foundation' ELSE NULL END"
              trf=f"CASE WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-SFNOC%' THEN 'SFNOC' WHEN UPPER(COALESCE({ag},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({ag},'')) LIKE '%JLK%' THEN 'THD Data' WHEN UPPER(COALESCE({ag},'')) LIKE '%HSBC-DATA%' THEN 'HSBC Data' ELSE NULL END"
              tp=[]; rp=[]
              if "ProjectName" in cols: tp.append(f"NULLIF(LTRIM(RTRIM({alias}.ProjectName)),'')")
              if has_tower: tp.append("t.TowerName")
              if has_tt: tp.append("tt.TowerName")
              tp.append(tf)
              if "TrackName" in cols: rp.append(f"NULLIF(LTRIM(RTRIM({alias}.TrackName)),'')")
              if has_track: rp.append("tr.TrackName")
              if has_tt: rp.append("tt.TrackName")
              rp.append(trf)
              tower_expr="COALESCE("+",".join(tp)+",'Unknown')"; track_expr="COALESCE("+",".join(rp)+",'Unknown')"
              scope=f"(:tower IS NULL OR {tower_expr}=:tower) AND (:track IS NULL OR {track_expr}=:track)"
              return cols,joins,tower_expr,track_expr,scope


          def get_tower_track_hierarchy'''
          s=re.sub(r'def _alert_context\(db, alias: str = "a"\):.*?\n\ndef get_tower_track_hierarchy',new_alert,s,count=1,flags=re.S)
          # Alert frequency: database Part/Device -> public Device.
          new_freq=r'''def get_alert_frequency(start_date=None,end_date=None,tower=None,track=None):
              db=SessionLocal()
              try:
                  cols,joins,_tower,_track,scope=_alert_context(db,"a")
                  device_expr="ISNULL(a.Part,'Unknown')" if "Part" in cols else ("ISNULL(a.Device,'Unknown')" if "Device" in cols else "'Unknown'")
                  q=f"SELECT {device_expr} Device,ISNULL(a.AlertType,'Unknown') AlertType,ISNULL(a.Severity,'Unknown') Severity,COUNT(*) AlertCount FROM qbr.Alert a {joins} WHERE {_date_filter('a','AlertTime')} AND {scope} GROUP BY {device_expr},ISNULL(a.AlertType,'Unknown'),ISNULL(a.Severity,'Unknown') ORDER BY AlertCount DESC,Device"
                  rows=db.execute(text(q),_params(start_date,end_date,tower,track)).fetchall()
                  return pd.DataFrame([{"Device":r.Device,"AlertType":r.AlertType,"Severity":r.Severity,"Count":_safe_int(r.AlertCount)} for r in rows])
              finally: db.close()


          def get_parent_child_relation'''
          s=re.sub(r'def get_alert_frequency\(start_date=None,end_date=None,tower=None,track=None\):.*?\n\ndef get_parent_child_relation',new_freq,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')

          # Loader: source files are disposable only after a clean DB load.
          p=Path('load_data.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('''        return load_dataframe(db, df, filepath.name)''','''        loaded, errors = load_dataframe(db, df, filepath.name)\n        return loaded, errors''',1)
          s=s.replace('''                    for filepath in sorted(files):\n                        load_file(db, filepath)''','''                    for filepath in sorted(files):\n                        loaded, errors = load_file(db, filepath)\n                        if errors == 0 and loaded > 0 and filepath.exists():\n                            try:\n                                filepath.unlink()\n                                print(f"  Deleted successfully loaded source: {filepath}")\n                            except OSError as exc:\n                                print(f"  WARNING: data loaded but could not delete {filepath}: {exc}")''')
          s=s.replace('''                load_file(db, filepath)''','''                loaded, errors = load_file(db, filepath)\n                if errors == 0 and loaded > 0 and filepath.exists():\n                    try:\n                        filepath.unlink()\n                        print(f"  Deleted successfully loaded source: {filepath}")\n                    except OSError as exc:\n                        print(f"  WARNING: data loaded but could not delete {filepath}: {exc}")''',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          python -m py_compile app/dashboard.py
          python -m py_compile app/dashboard_data.py
          python -m py_compile load_data.py
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py app/dashboard_data.py load_data.py
          git commit -m "[final-fix] restore volume narrative, device labels and dataset cleanup"
          git push origin test-chatgpt-write
      - name: Cleanup temporary files
        run: |
          git rm -f FEATURE_FIX_TRIGGER.md .github/workflows/final-fix.yml .github/workflows/feature-fix.yml .github/workflows/feature-fix2.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cleanup temporary repair files" || true
          git push origin test-chatgpt-write || true
