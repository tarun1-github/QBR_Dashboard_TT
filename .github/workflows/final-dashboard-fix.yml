name: Final dashboard cleanup
on:
  push:
    branches: [test-chatgpt-write]
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-cleanup]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-chatgpt-write
          fetch-depth: 0
      - name: Fix chart call and wording
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/dashboard.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ticket_volume_by_tower_track_figure(volume_df,"📊 Ticket Volume by Tower → Track",430)', 'ticket_volume_by_tower_track_figure(vol,"📊 Ticket Volume by Tower → Track",430)')
          s=s.replace('3D executive view • Total tickets are shown as columns; parent and child workload are shown as trend lines. Hover over any column for the exact count.', 'Executive view • Total tickets are shown as columns; parent and child workload are shown as trend lines. Hover for the exact count.')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          python -m py_compile app/dashboard.py
          python -m py_compile app/dashboard_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py app/dashboard_data.py
          git commit -m "[dashboard-cleanup] fix executive chart source and wording" || true
          git push origin test-chatgpt-write
      - name: Remove workflow
        run: |
          git rm .github/workflows/final-dashboard-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary cleanup workflow" || true
          git push origin test-chatgpt-write || true
