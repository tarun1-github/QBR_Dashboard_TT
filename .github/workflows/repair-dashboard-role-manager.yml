name: Repair dashboard role-manager merge

on:
  push:
    branches: [test-chatgpt-write]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair dashboard merge artifacts
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app/dashboard.py")
          s = p.read_text(encoding="utf-8")
          original = s

          # Remove the second sidebar block introduced by the merge. It starts
          # with the undefined variable r and duplicates the Tower selector.
          pattern = r'\n    st\.divider\(\);allowed=assigned_tracks\(uname\(\)\) if r=="MANAGER" else \[\].*?\n    st\.markdown\(\'<div class="qbr-side-head">2'
          replacement = '\n    st.markdown(\'<div class="qbr-side-head">2'
          s, n1 = re.subn(pattern, replacement, s, count=1, flags=re.S)

          # Remove an immediately repeated admin selector statement if present.
          admin_pattern = r'(?m)^(        tsel=st\.selectbox\("Tower",towers,key="admin_tower"\);.*?aa,bb,cc=st\.columns\(3\)\n)\\1'
          s, n2 = re.subn(admin_pattern, r'\\1', s, count=1, flags=re.S)

          if s != original:
              p.write_text(s, encoding="utf-8")
              print(f"Repaired dashboard.py: sidebar={n1}, admin={n2}")
          else:
              print("No merge artifacts matched; leaving dashboard.py unchanged.")

      - name: Validate Python syntax
        run: python -m py_compile app/dashboard.py

      - name: Commit repaired dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Fix dashboard role-manager merge conflict"
          git push
