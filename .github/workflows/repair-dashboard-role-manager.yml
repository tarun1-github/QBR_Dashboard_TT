name: Repair dashboard role-manager merge

on:
  push:
    branches: [test-chatgpt-write]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate role-manager/sidebar merge block
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app/dashboard.py")
          s = p.read_text(encoding="utf-8")

          # The merge introduced a second sidebar block beginning with an
          # undefined variable `r`. The first sidebar block already provides
          # Tower, Track, Time View and Date Range, so remove the duplicate.
          pattern = (
              r'\n    st\.divider\(\);allowed=assigned_tracks\(uname\(\)\) if r=="MANAGER" else \[\]'
              r'.*?'
              r'\n    st\.markdown\(\'<div class="qbr-side-head">2️⃣ TRACK</div>\''
          )
          replacement = '\n    st.markdown(\'<div class="qbr-side-head">2️⃣ TRACK</div>\''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)

          # Also remove an accidental duplicated admin selector line if the
          # merge produced it twice consecutively.
          admin_line = r'(?m)^(        tsel=st\.selectbox\("Tower",towers,key="admin_tower"\);.*?aa,bb,cc=st\.columns\(3\)\n)'
          m = list(re.finditer(admin_line, s2))
          if len(m) > 1:
              start, end = m[1].span()
              s2 = s2[:start] + s2[end:]
              n += 1

          if n:
              p.write_text(s2, encoding="utf-8")
              print(f"dashboard.py repaired ({n} change(s))")
          else:
              print("No matching merge-conflict block found.")

      - name: Validate Python syntax
        run: python -m py_compile app/dashboard.py

      - name: Commit repaired dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Fix dashboard role-manager merge conflict"
          git push
