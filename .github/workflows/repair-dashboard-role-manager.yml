name: Repair dashboard role-manager merge

on:
  push:
    branches: [test-chatgpt-write]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair dashboard merge artifacts
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/dashboard.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          original = list(lines)

          # Find the accidental second sidebar block. The first occurrence is
          # valid; the block containing `r=="MANAGER"` is the bad merge copy.
          start = next((i for i, line in enumerate(lines) if 'if r=="MANAGER"' in line), None)
          if start is not None:
              end = next((i for i in range(start, len(lines)) if '2️⃣ TRACK' in lines[i]), None)
              if end is not None:
                  del lines[start:end]

          # Collapse a duplicated admin selector if present.
          needle = 'tsel=st.selectbox("Tower",towers,key="admin_tower")'
          seen = 0
          cleaned = []
          for line in lines:
              if needle in line:
                  seen += 1
                  if seen > 1:
                      continue
              cleaned.append(line)
          lines = cleaned

          if lines != original:
              p.write_text(''.join(lines), encoding="utf-8")
              print("dashboard.py repaired")
          else:
              print("No merge artifacts found")

      - name: Validate Python syntax
        run: python -m py_compile app/dashboard.py

      - name: Commit repaired dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Fix dashboard role-manager merge conflict"
          git push
