name: Dashboard feature fix
on:
  push:
    branches: [test-chatgpt-write]
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[feature-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-chatgpt-write
          fetch-depth: 0
      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------- dashboard_data.py ----------
          p=Path('app/dashboard_data.py')
          s=p.read_text(encoding='utf-8')

          new_ticket = r'''def _ticket_context(db, alias: str = "tk"):
              cols = _columns(db, "Ticket")
              joins = ""
              project_expr = f"NULL"
              tower_expr = f"'Unknown'"
              track_expr = f"'Unknown'"

              has_tower = "TowerID" in cols and _table_exists(db, "Tower")
              has_track = "TrackID" in cols and _table_exists(db, "Track")
              has_tt = "TowerTrackID" in cols and _table_exists(db, "TowerTrack")
              if has_tower:
                  joins += f" LEFT JOIN qbr.Tower t ON t.TowerID={alias}.TowerID"
              if has_track:
                  joins += f" LEFT JOIN qbr.Track tr ON tr.TrackID={alias}.TrackID"
              if has_tt:
                  joins += f" LEFT JOIN qbr.TowerTrack tt ON tt.TowerTrackID={alias}.TowerTrackID"

              # Prefer normalized FK hierarchy, then text columns, then the
              # assignment-group fallback used by the loader.
              assignment = f"NULLIF(LTRIM(RTRIM({alias}.AssignmentGroup)),'')" if "AssignmentGroup" in cols else "NULL"
              tower_fallback = f"CASE WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-SFNOC%' OR UPPER(COALESCE({assignment},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({assignment},'')) LIKE '%HSBC-DATA%' THEN 'Foundation' ELSE NULL END"
              track_fallback = f"CASE WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-SFNOC%' THEN 'SFNOC' WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({assignment},'')) LIKE '%JLK%' THEN 'THD Data' WHEN UPPER(COALESCE({assignment},'')) LIKE '%HSBC-DATA%' THEN 'HSBC Data' ELSE NULL END"

              tower_parts=[]
              track_parts=[]
              if "ProjectName" in cols: tower_parts.append(f"NULLIF(LTRIM(RTRIM({alias}.ProjectName)),'')")
              if has_tower: tower_parts.append("t.TowerName")
              if has_tt: tower_parts.append("tt.TowerName")
              tower_parts.append(tower_fallback)
              if "TrackName" in cols: track_parts.append(f"NULLIF(LTRIM(RTRIM({alias}.TrackName)),'')")
              if has_track: track_parts.append("tr.TrackName")
              if has_tt: track_parts.append("tt.TrackName")
              track_parts.append(track_fallback)
              tower_expr = "COALESCE(" + ",".join(tower_parts) + ",'Unknown')"
              track_expr = "COALESCE(" + ",".join(track_parts) + ",'Unknown')"

              scope_parts=[f"(:tower IS NULL OR {tower_expr}=:tower)",f"(:track IS NULL OR {track_expr}=:track)"]
              return cols, joins, tower_expr, track_expr, " AND ".join(scope_parts)


          def _alert_context(db, alias: str = "a"):
              cols = _columns(db, "Alert")
              joins = ""
              has_tower = "TowerID" in cols and _table_exists(db, "Tower")
              has_track = "TrackID" in cols and _table_exists(db, "Track")
              has_tt = "TowerTrackID" in cols and _table_exists(db, "TowerTrack")
              if has_tower: joins += f" LEFT JOIN qbr.Tower t ON t.TowerID={alias}.TowerID"
              if has_track: joins += f" LEFT JOIN qbr.Track tr ON tr.TrackID={alias}.TrackID"
              if has_tt: joins += f" LEFT JOIN qbr.TowerTrack tt ON tt.TowerTrackID={alias}.TowerTrackID"
              assignment = f"NULLIF(LTRIM(RTRIM({alias}.AssignmentGroup)),'')" if "AssignmentGroup" in cols else "NULL"
              tower_fallback = f"CASE WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-SFNOC%' OR UPPER(COALESCE({assignment},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({assignment},'')) LIKE '%HSBC-DATA%' THEN 'Foundation' ELSE NULL END"
              track_fallback = f"CASE WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-SFNOC%' THEN 'SFNOC' WHEN UPPER(COALESCE({assignment},'')) LIKE '%FN-THD%' OR UPPER(COALESCE({assignment},'')) LIKE '%JLK%' THEN 'THD Data' WHEN UPPER(COALESCE({assignment},'')) LIKE '%HSBC-DATA%' THEN 'HSBC Data' ELSE NULL END"
              tower_parts=[]; track_parts=[]
              if "ProjectName" in cols: tower_parts.append(f"NULLIF(LTRIM(RTRIM({alias}.ProjectName)),'')")
              if has_tower: tower_parts.append("t.TowerName")
              if has_tt: tower_parts.append("tt.TowerName")
              tower_parts.append(tower_fallback)
              if "TrackName" in cols: track_parts.append(f"NULLIF(LTRIM(RTRIM({alias}.TrackName)),'')")
              if has_track: track_parts.append("tr.TrackName")
              if has_tt: track_parts.append("tt.TrackName")
              track_parts.append(track_fallback)
              tower_expr="COALESCE("+",".join(tower_parts)+",'Unknown')"
              track_expr="COALESCE("+",".join(track_parts)+",'Unknown')"
              scope=" AND ".join([f"(:tower IS NULL OR {tower_expr}=:tower)",f"(:track IS NULL OR {track_expr}=:track)"])
              return cols, joins, tower_expr, track_expr, scope
          '''
          s=re.sub(r'def _ticket_context\(db, alias: str = "tk"\):.*?\n\ndef get_tower_track_hierarchy', new_ticket+'\n\ndef get_tower_track_hierarchy', s, count=1, flags=re.S)

          # Alert frequency: expose the existing database Part field as Device.
          old='''q=f"SELECT ISNULL(a.Part,'Unknown') Part,ISNULL(a.AlertType,'Unknown') AlertType,ISNULL(a.Severity,'Unknown') Severity,COUNT(*) AlertCount FROM qbr.Alert a {joins} WHERE {_date_filter('a','AlertTime')} AND {scope} GROUP BY ISNULL(a.Part,'Unknown'),ISNULL(a.AlertType,'Unknown'),ISNULL(a.Severity,'Unknown') ORDER BY AlertCount DESC,Part"'''
          new='''device_expr = "ISNULL(a.Part,'Unknown')" if "Part" in _cols else ("ISNULL(a.Device,'Unknown')" if "Device" in _cols else "'Unknown'")
          q=f"SELECT {device_expr} Device,ISNULL(a.AlertType,'Unknown') AlertType,ISNULL(a.Severity,'Unknown') Severity,COUNT(*) AlertCount FROM qbr.Alert a {joins} WHERE {_date_filter('a','AlertTime')} AND {scope} GROUP BY {device_expr},ISNULL(a.AlertType,'Unknown'),ISNULL(a.Severity,'Unknown') ORDER BY AlertCount DESC,Device"'''
          if old not in s: raise SystemExit('alert query anchor not found')
          s=s.replace(old,new)
          s=s.replace('return pd.DataFrame([{"Part":r.Part,"AlertType":r.AlertType,"Severity":r.Severity,"Count":_safe_int(r.AlertCount)} for r in rows])','return pd.DataFrame([{"Device":r.Device,"AlertType":r.AlertType,"Severity":r.Severity,"Count":_safe_int(r.AlertCount)} for r in rows])')

          p.write_text(s,encoding='utf-8')

          # ---------- dashboard.py ----------
          p=Path('app/dashboard.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('d=alerts.groupby("Part",as_index=False)["Count"].sum().sort_values("Count",ascending=False).head(10);st.plotly_chart(horizontal_bar(d["Part"].astype(str).tolist(),d["Count"].tolist(),"⚡ Highest Alert / Part Frequency","#d3342f",360," alerts"),use_container_width=True,config={"displayModeBar":False})', 'd=alerts.groupby("Device",as_index=False)["Count"].sum().sort_values("Count",ascending=False).head(10);st.plotly_chart(horizontal_bar(d["Device"].astype(str).tolist(),d["Count"].tolist(),"⚡ Highest Alert / Device Frequency","#d3342f",360," alerts"),use_container_width=True,config={"displayModeBar":False})')
          anchor='''for c,item in zip(st.columns(4),kpis[5:]):render_kpi(c,item)\n\nif view=="Day":'''
          insert='''for c,item in zip(st.columns(4),kpis[5:]):render_kpi(c,item)\n\n# Restore the executive max/min narrative that was previously shown below the KPI cards.\nif stats and stats.get("max_date") is not None and stats.get("min_date") is not None:\n    max_date=pd.to_datetime(stats["max_date"]).strftime("%d %b %Y")\n    min_date=pd.to_datetime(stats["min_date"]).strftime("%d %b %Y")\n    st.markdown(f'<div class="qbr-volume-note">📌 Maximum ticket volume: <b>{_safe_int(stats.get("max_count")):,}</b> tickets on <b>{max_date}</b> &nbsp; • &nbsp; Minimum ticket volume: <b>{_safe_int(stats.get("min_count")):,}</b> tickets on <b>{min_date}</b>.</div>',unsafe_allow_html=True)\n\nif view=="Day":'''
          if anchor not in s: raise SystemExit('KPI anchor not found')
          s=s.replace(anchor,insert)
          p.write_text(s,encoding='utf-8')

          # ---------- load_data.py ----------
          p=Path('load_data.py'); s=p.read_text(encoding='utf-8')
          # Return errors to the caller and delete only after a clean load.
          old='''        return load_dataframe(db, df, filepath.name)'''
          new='''        loaded, errors = load_dataframe(db, df, filepath.name)\n        return loaded, errors'''
          if old not in s: raise SystemExit('load_file anchor not found')
          s=s.replace(old,new,1)
          old_loop='''                    for filepath in sorted(files):\n                        load_file(db, filepath)'''
          new_loop='''                    for filepath in sorted(files):\n                        loaded, errors = load_file(db, filepath)\n                        # Remove source files only after the DB transaction completed\n                        # with zero row-level errors. Failed/partially loaded files stay\n                        # in app/dataset so they can be investigated and retried.\n                        if errors == 0 and loaded > 0 and filepath.exists():\n                            try:\n                                filepath.unlink()\n                                print(f"  Deleted successfully loaded source: {filepath}")\n                            except OSError as exc:\n                                print(f"  WARNING: data loaded but could not delete {filepath}: {exc}")'''
          if old_loop not in s: raise SystemExit('dataset loop anchor not found')
          s=s.replace(old_loop,new_loop)
          old_specific='''                load_file(db, filepath)'''
          new_specific='''                loaded, errors = load_file(db, filepath)\n                if errors == 0 and loaded > 0 and filepath.exists():\n                    try:\n                        filepath.unlink()\n                        print(f"  Deleted successfully loaded source: {filepath}")\n                    except OSError as exc:\n                        print(f"  WARNING: data loaded but could not delete {filepath}: {exc}")'''
          if old_specific not in s: raise SystemExit('specific-file anchor not found')
          s=s.replace(old_specific,new_specific,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          python -m py_compile app/dashboard.py
          python -m py_compile app/dashboard_data.py
          python -m py_compile load_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py app/dashboard_data.py load_data.py
          git commit -m "[feature-fix] restore max min narrative, device labels and source cleanup" || true
          git push origin test-chatgpt-write
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/feature-fix.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary feature fix workflow" || true
          git push origin test-chatgpt-write || true
