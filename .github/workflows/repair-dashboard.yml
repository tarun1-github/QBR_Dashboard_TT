name: Repair dashboard

on:
  push:
    branches: [test-chatgpt-write]

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-repair]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-chatgpt-write
          fetch-depth: 0

      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          import re

          dashboard = Path('app/dashboard.py')
          data = Path('app/dashboard_data.py')

          text = dashboard.read_text(encoding='utf-8')

          volume_fn = r'''def executive_volume_figure(df, x_col, title="📈 Executive Ticket Volume", height=430):
              """Clean executive trend: total tickets as bars, parent/child as lines."""
              d = df.copy().reset_index(drop=True)
              if d.empty:
                  return go.Figure()
              d["Total"] = pd.to_numeric(d["Total"], errors="coerce").fillna(0).astype(int)
              parents = pd.to_numeric(d.get("Parents", 0), errors="coerce").fillna(0).astype(int) if "Parents" in d else pd.Series([0] * len(d))
              children = pd.to_numeric(d.get("Children", 0), errors="coerce").fillna(0).astype(int) if "Children" in d else pd.Series([0] * len(d))
              labels = d[x_col].astype(str).tolist()
              fig = go.Figure()
              fig.add_trace(go.Bar(
                  x=labels, y=d["Total"], name="Total",
                  marker=dict(color="#198da2", line=dict(color="#0f6f82", width=1)),
                  text=d["Total"], textposition="outside",
                  hovertemplate="<b>%{x}</b><br>Total tickets: %{y}<extra></extra>"
              ))
              fig.add_trace(go.Scatter(
                  x=labels, y=parents, name="Parent", mode="lines+markers+text",
                  text=parents.astype(str), textposition="top center",
                  line=dict(color="#6b9e3b", width=3), marker=dict(size=7),
                  hovertemplate="<b>%{x}</b><br>Parent: %{y}<extra></extra>"
              ))
              fig.add_trace(go.Scatter(
                  x=labels, y=children, name="Child", mode="lines+markers+text",
                  text=children.astype(str), textposition="top center",
                  line=dict(color="#ef7d2b", width=3), marker=dict(size=7),
                  hovertemplate="<b>%{x}</b><br>Child: %{y}<extra></extra>"
              ))
              fig.update_layout(
                  title=dict(text=title, font=dict(size=16, color="#12344d"), x=0.01),
                  height=height, margin=dict(l=40, r=25, t=50, b=45),
                  paper_bgcolor="rgba(0,0,0,0)", plot_bgcolor="#ffffff",
                  font=dict(family="Segoe UI", size=11, color="#12344d"),
                  hoverlabel=dict(bgcolor="#12344d", font_color="#ffffff"),
                  legend=dict(orientation="h", x=0, y=1.08),
                  bargap=0.28
              )
              fig.update_xaxes(title="Period", showgrid=False, tickangle=-25)
              fig.update_yaxes(title="Tickets", rangemode="tozero", gridcolor="#e3edf0")
              return fig

          def ticket_volume_by_tower_track_figure(df, title="📊 Ticket Volume by Tower → Track", height=430):
              """Clean executive horizontal ranking of ticket volume."""
              d = df.copy()
              if d.empty:
                  return go.Figure()
              d["Total"] = pd.to_numeric(d["Total"], errors="coerce").fillna(0).astype(int)
              d["Label"] = d["Tower"].astype(str) + " → " + d["Track"].astype(str)
              d = d.sort_values("Total", ascending=True).tail(12)
              palette = {"Foundation":"#5b9f3b", "Collaboration":"#198da2", "Security":"#d94a4a", "Non-CMS":"#9b7b24"}
              colors = [palette.get(str(t), "#547a90") for t in d["Tower"]]
              fig = go.Figure(go.Bar(
                  x=d["Total"], y=d["Label"], orientation="h",
                  marker=dict(color=colors, line=dict(color="#ffffff", width=1)),
                  text=d["Total"], textposition="outside", cliponaxis=False,
                  customdata=d[["Tower","Track"]],
                  hovertemplate="<b>%{y}</b><br>Tower: %{customdata[0]}<br>Track: %{customdata[1]}<br>Tickets: %{x}<extra></extra>"
              ))
              fig.update_layout(
                  title=dict(text=title, font=dict(size=16, color="#12344d"), x=0.01),
                  height=height, margin=dict(l=10, r=55, t=50, b=35),
                  paper_bgcolor="rgba(0,0,0,0)", plot_bgcolor="#ffffff",
                  font=dict(family="Segoe UI", size=11, color="#12344d"), showlegend=False
              )
              fig.update_xaxes(title="Tickets", rangemode="tozero", gridcolor="#e3edf0")
              fig.update_yaxes(title="", showgrid=False, automargin=True)
              return fig
          '''

          # Replace the two complex 3-D helper functions with clean executive charts.
          text = re.sub(r'def three_d_volume_figure\(.*?(?=\ndef )', volume_fn + '\n\n', text, count=1, flags=re.S)
          text = re.sub(r'def three_d_category_figure\(.*?(?=\ndef )', '', text, count=1, flags=re.S)
          # Replace current calls where the previous 3-D helpers are used.
          text = text.replace(
              'three_d_volume_figure(trend,x,"📈 Executive Ticket Volume — 3D Trend",450)',
              'executive_volume_figure(trend,x,"📈 Executive Ticket Volume",430)'
          )
          # If the source uses another formatting, replace the call expression safely.
          def replace_call(src, name, replacement):
              pos = src.find(name + '(')
              if pos < 0:
                  return src
              i = pos + len(name)
              depth = 0
              quote = None
              esc = False
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'"):
                          quote = ch
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              return src[:pos] + replacement + src[i+1:]
                  i += 1
              return src

          text = replace_call(text, 'three_d_volume_figure', 'executive_volume_figure(trend,x,"📈 Executive Ticket Volume",430)')
          text = replace_call(text, 'three_d_category_figure', 'ticket_volume_by_tower_track_figure(volume_df,"📊 Ticket Volume by Tower → Track",430)')

          # Remove the optional Clear caches sidebar action so the confirmation dialog is no longer presented.
          text = re.sub(r'(?m)^[ \t]*if .*?(?:st\.)?(?:button|form_submit_button).*?[Cc]lear caches.*?:\n(?:^[ \t]+.*\n)+', '', text)
          text = re.sub(r'(?m)^.*(?:Clear caches|clear_caches).*\n', '', text)

          dashboard.write_text(text, encoding='utf-8')

          # Ensure Foundation always exposes the three required tracks, using either
          # TowerTrack or the normalized Tower/Track tables as the source of truth.
          src = data.read_text(encoding='utf-8')
          hierarchy_fn = r'''def get_tower_track_hierarchy():
              db = SessionLocal()
              try:
                  out = {}
                  # Prefer TowerTrack, but also merge qbr.Tower/qbr.Track because some
                  # environments have a partial TowerTrack catalogue.
                  if _table_exists(db, "TowerTrack"):
                      rows = db.execute(text("SELECT TowerTrackID,TowerName,TrackName FROM qbr.TowerTrack WHERE ISNULL(IsActive,1)=1 ORDER BY TowerName,TrackName")).fetchall()
                      for r in rows:
                          out.setdefault(str(r.TowerName), {})[str(r.TrackName)] = {"TowerTrackID": r.TowerTrackID, "TrackName": str(r.TrackName)}
                  if _table_exists(db, "Tower") and _table_exists(db, "Track"):
                      rows = db.execute(text("SELECT t.TowerID,tr.TrackID,t.TowerName,tr.TrackName FROM qbr.Tower t JOIN qbr.Track tr ON tr.TowerID=t.TowerID WHERE ISNULL(t.IsActive,1)=1 AND ISNULL(tr.IsActive,1)=1 ORDER BY t.TowerName,tr.TrackName")).fetchall()
                      for r in rows:
                          tower = str(r.TowerName); track = str(r.TrackName)
                          out.setdefault(tower, {}).setdefault(track, {"TowerTrackID": r.TrackID, "TrackName": track})
                  result = {tower: list(tracks.values()) for tower, tracks in out.items()}
                  if "Foundation" in result:
                      wanted = ["SFNOC", "THD Data", "HSBC Data"]
                      found = {str(x["TrackName"]): x for x in result["Foundation"]}
                      result["Foundation"] = [found[name] for name in wanted if name in found]
                  return result
              finally:
                  db.close()

          '''
          src = re.sub(r'def get_tower_track_hierarchy\(\):.*?(?=\ndef )', hierarchy_fn, src, count=1, flags=re.S)
          data.write_text(src, encoding='utf-8')

      - name: Validate Python
        run: |
          python -m py_compile app/dashboard.py
          python -m py_compile app/dashboard_data.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard.py app/dashboard_data.py
          git commit -m "[dashboard-repair] simplify executive charts and fix Foundation hierarchy" || exit 0
          git push origin test-chatgpt-write

      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/repair-dashboard.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary repair workflow" || true
          git push origin test-chatgpt-write || true
