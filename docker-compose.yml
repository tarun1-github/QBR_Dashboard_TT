services:
  qbr-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qbr-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env.docker
    restart: unless-stopped
    volumes:
      - ./app/dataset:/app/app/dataset
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
